  <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="17" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Free<tspan fill="#F97316">RTOS</tspan></text>
</svg>