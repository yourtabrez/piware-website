<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 36" fill="none">
  <!-- Git Rotated Diamond Mark -->
  <g transform="translate(6, 4)">
    <rect x="3" y="3" width="22" height="22" rx="4" transform="rotate(45 14 14)" fill="#F05032"/>
    <!-- Git Nodes and Branches -->
    <circle cx="10" cy="14" r="2.2" fill="#FFFFFF"/>
    <circle cx="18" cy="10" r="2.2" fill="#FFFFFF"/>
    <circle cx="18" cy="18" r="2.2" fill="#FFFFFF"/>
    <path d="M10 14h4c2 0 4-1.5 4-4" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M10 14h4c2 0 4 1.5 4 4" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Git Wordmark -->
  <text x="42" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="700" fill="#F05032" letter-spacing="-0.5">git</text>
</svg>