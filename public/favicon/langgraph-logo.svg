<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none">
  <!-- LangGraph Node Graph Mark -->
  <g transform="translate(6, 4)">
    <rect width="28" height="28" rx="7" fill="#0F172A"/>
    <!-- Interconnected Cyclic Nodes -->
    <circle cx="14" cy="9" r="2.8" fill="#38BDF8"/>
    <circle cx="8" cy="20" r="2.8" fill="#818CF8"/>
    <circle cx="20" cy="20" r="2.8" fill="#34D399"/>
    <!-- Edges -->
    <path d="M14 11.8L8 17.2" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M14 11.8L20 17.2" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M10.8 20h6.4" stroke="#818CF8" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Cyclic Loop Curve -->
    <path d="M20 20c4-4 2-12-4-11" stroke="#34D399" stroke-width="1" stroke-dasharray="1.5 1.5"/>
  </g>
  <!-- LangGraph Typography -->
  <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="17" font-weight="700" fill="#0F172A" letter-spacing="-0.3">LangGraph</text>
</svg>